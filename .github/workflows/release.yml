# Publishes to npm when a version tag (v*) is pushed.
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret, provenance is attached.
# The tag must match package.json, so `npm version <bump> && git push --follow-tags` is the release flow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - name: Check tag matches package version
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $PACKAGE_VERSION"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs typecheck, lint, tests, build and the exports check.
      - run: npm publish
